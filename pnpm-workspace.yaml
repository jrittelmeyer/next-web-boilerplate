  # fire — the same defect already fixed for fast-uri and dompurify 2026-08-12.
  # The ranged key rewrites only vulnerable copies and goes inert once the tree
  # resolves >=5.0.9 naturally; the conversion itself moved nothing.
  "brace-expansion@<5.0.9": 5.0.9
  # ——— Advisory remediation (2026-07-22): transitive-only advisories, all newly
