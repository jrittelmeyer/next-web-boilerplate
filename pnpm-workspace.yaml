  # gate here (Dependabot is the supplementary signal).
  #
  # fast-uri <3.1.4 (GHSA-v2hh-gcrm-f6hx + GHSA-4c8g-83qw-93j6, HIGH — host
  # confusion via a literal backslash / failed IDN canonicalization), via
  # ajv@8.20.0 (webpack's schema-utils, reached by @sentry/webpack-plugin and
  # Storybook's builder-vite — build-tooling only, zero request-handling
  # exposure). 3.1.4 CLEARED the 7-day gate 2026-07-26 (published 2026-07-19) and is
