packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
# Native deps allowed to run install/build scripts (pnpm 11 replaced
# onlyBuiltDependencies with allowBuilds). sharp = Next.js image optimization.
# msgpackr-extract (transitive via uploadthing) is an *optional* native
# accelerator for msgpackr; left off — msgpackr falls back to pure JS, so we
# don't compile it. Explicit `false` records the decision (pnpm re-prompts if
# the key is removed).
#
# @sentry/cli (via @sentry/nextjs → @sentry/bundler-plugin-core) postinstalls a
# native sentry-cli binary used ONLY for source-map *upload* during `next build`,
# which is gated on SENTRY_AUTH_TOKEN (+org/project) — creds the boilerplate
# default doesn't ship. Left off so installs stay network-light and the no-creds
# build is unaffected; flip to true when wiring real source-map upload in CI.
# core-js (transitive via posthog-js) postinstall only prints a funding banner —
# pure-JS polyfill, no build artifact — so skip it.
#
# @swc/core + @parcel/watcher (transitive via next-intl) back its OPTIONAL
# build-time features — the experimental SWC plugin and message-file watching for
# typed-message generation — which this app doesn't enable. Both also ship prebuilt
# platform binaries (their build script only compiles from source as a fallback),
# so `false` keeps installs cross-platform (no node-gyp on Windows) and network-light
# without affecting our setup.
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  core-js: false
  esbuild: true
  msgpackr-extract: false
  sharp: true
# Pin vite (pulled transitively by vitest) to an aged release. vitest@4's dep
# range is vite ^6||^7||^8, which otherwise resolves to the newest 8.x — and the
# current 8.1.0 was published hours ago. We never import vite directly (we use
# vitest/config), so an override is the right tool: it keeps the test runner off
# brand-new releases per the no-fresh-deps policy. Bump as newer 8.x ages out.
overrides:
  vite: 8.0.16
  # ——— Dependabot remediation (2026-07-15): 3 transitive-only alerts with NO upstream
  # fix available (uploadthing@7.7.4 exact-pins effect 3.17.7 · next@16.2.11 pins
  # postcss 8.4.31 · drizzle-kit@0.31.10 still deps the deprecated @esbuild-kit).
  # TEMPORARY — each override's removal condition is tracked in
  # docs/MAINTENANCE.md → Watch items.
  #
  # effect <3.20.0 (GHSA-38f7-945m-qr2g, HIGH — AsyncLocalStorage context loss under
  # concurrent RPC load). 3.21.4 is in-range for @effect/platform@0.90.3's peer
  # (^3.17.7) and clears the 7-day age gate (published 2026-06-18). Expect harmless
  # peer warnings from uploadthing's exact 3.17.7 pins. Remove when uploadthing
  # ships on effect >=3.20.
  effect: 3.21.4
  # postcss <=8.5.22 (GHSA-fxqj-rqcc-2cmp, MODERATE — incomplete fix of
  # GHSA-6g55-p6wh-862q: attacker-controlled `sourceMappingURL` reads arbitrary .map
  # files when `from` is unset). THIRD floor move for this key (2026-08-04, batch #5):
  # the 8.5.20 pinned on 07-27 — itself a retarget after the 8.5.15 pin went
  # vulnerable — fell inside the new advisory's range, so the floor and value move
  # again. Advisories this entry still covers: GHSA-r28c-9q8g-f849 (<=8.5.17, path
  # traversal via the `prev` source-map annotation) and GHSA-qx2v-qp2m-jg93 (<8.5.10,
  # XSS via unescaped </style> in stringify). 8.5.23 (published 2026-07-24, aged in
  # 07-31) is the advisory floor; 8.5.24 (07-28) and 8.5.25 (= `latest`, 07-29) exist
  # but were boundary-fresh at take time and carry no advisory delta, so aged wins.
  # Ranged key so an already-safe >=8.5.23 copy is left alone. Remove when next's own
  # pin AND the natural tree resolution both reach >=8.5.23.
  "postcss@<=8.5.22": 8.5.23
  # esbuild <=0.24.2 (GHSA-67mh-4wv8-2f99 — dev server lets any site read responses),
  # via drizzle-kit → @esbuild-kit/core-utils (deprecated upstream, frozen on 0.18.x).
  # Child-scoped so the healthy 0.25.12/0.28.1 copies elsewhere in the tree stay
  # untouched; 0.25.12 was already in the lockfile. Remove when drizzle-kit drops
  # @esbuild-kit.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # brace-expansion — TWO advisories on the same expand()/expand_() path, via
  # minimatch@10.2.5 (eslint, and glob@13.0.6 used by Storybook/Sentry's webpack
  # plugin/react-email — all build-tooling paths, not request-handling code):
  #   - GHSA-3jxr-9vmj-r5cp (<5.0.7, HIGH — O(2^n) DoS in expand() on crafted brace
  #     patterns): FIXED by this override. 5.0.7 is in-range for minimatch's own
  #     `^5.0.5` — a plain fix-forward, not a pin-bypass.
  #   - GHSA-mh99-v99m-4gvg / CVE-2026-14257 (<=5.0.7, HIGH — expand_() caps the result
  #     COUNT but not each result's LENGTH, so ~7.5 KB of input reaches an uncatchable
  #     OOM): FIXED by this override since 2026-07-30. 5.0.8 (published
  #     2026-07-23T11:39:25Z) cleared the 7-day gate that day, so the ignoreGhsas
  #     deferral it had been holding was dropped and the allowlist re-emptied — pnpm
  #     audit now guards BOTH advisories live. 5.0.8 is likewise in-range for
  #     minimatch's own `^5.0.5`, so this stays a fix-forward, not a pin-bypass.
  #   - GHSA-rgw5-rvv9-x895 (<5.0.9, HIGH — the CVE-2026-14257 mitigation above can be
  #     BYPASSED with nested arrays, so 5.0.8 is not actually fixed): FIXED by this
  #     override, 2026-08-03. ⚠️ 5.0.9 (published 2026-07-30) was **4 days old** when
  #     taken — inside the 7-day gate — under a dated, version-scoped
  #     `minimumReleaseAgeExclude`. **Owner-approved exception, 2026-08-03**, taken over
  #     the alternative this file's own auditConfig note prescribes (park it in
  #     `ignoreGhsas`, wait, then override). Recorded rather than quietly done, because
  #     it is the first time that rule was set aside. The exclusion went inert when
  #     5.0.9 aged in and was deleted on schedule 2026-08-06.
  # Remove this override once a routine bump naturally carries the lockfile past 5.0.9.
  brace-expansion: 5.0.9
  # ——— Advisory remediation (2026-07-22): transitive-only advisories, all newly
  # disclosed since the prior day's green CI run (pnpm audit queries live
  # advisory data — nothing in the lockfile changed to surface these). Only
  # brace-expansion (above) was a Dependabot alert; dompurify, sharp, and
  # fast-uri were caught by CI's pnpm-audit lane — the authoritative advisory
  # gate here (Dependabot is the supplementary signal).
  #
  # fast-uri <3.1.4 (GHSA-v2hh-gcrm-f6hx + GHSA-4c8g-83qw-93j6, HIGH — host
  # confusion via a literal backslash / failed IDN canonicalization), via
  # ajv@8.20.0 (webpack's schema-utils, reached by @sentry/webpack-plugin and
  # Storybook's builder-vite — build-tooling only, zero request-handling
  # exposure). 3.1.4 CLEARED the 7-day gate 2026-07-26 (published 2026-07-19) and is
  # in-range for ajv's own `^3.0.1`; the two deferral entries this pair held in
  # auditConfig.ignoreGhsas were removed with this override (lockfile was on 3.1.2).
  # ⚠️ 2026-08-04 (batch #5): 3.1.4 was ITSELF vulnerable to GHSA-7p8r-x3mc-p8w7
  # (<3.1.5, HIGH — host confusion via a backslash authority introducer, the third
  # of the family). The only fix, 3.1.5 (published 2026-07-31T09:16:56Z), sat inside
  # the 7-day gate until 2026-08-07 ~09:17 UTC, so that advisory was PARKED in
  # auditConfig.ignoreGhsas below — route (1) of the rule at minimumReleaseAge —
  # and the park EXITED on schedule 2026-08-07: override raised to 3.1.5, ignore
  # entry deleted, one change. 3.1.5 heads the 3.x line (npm `latest` is the 4.x
  # major, outside ajv's ^3.0.1). Remove this override once a routine bump naturally
  # carries the lockfile past 3.1.5 — dropping it earlier would regress all three
  # GHSAs (3.1.2 satisfies ajv's range too).
  fast-uri: 3.1.5
  #
  # dompurify <=3.4.11 (GHSA-c2j3-45gr-mqc4, low — CUSTOM_ELEMENT_HANDLING
  # bypasses afterSanitizeElements), via posthog-js's own sanitizer dependency
  # (a real runtime path — posthog-js ships client-side). 3.4.12 is in-range for
  # posthog-js's own `^3.3.2` — plain fix-forward; remove once a routine bump
  # naturally carries the lockfile past 3.4.12.
  dompurify: 3.4.12
  # sharp <0.35.0 (GHSA-f88m-g3jw-g9cj — inherited libvips CVE-2026-33327/33328/
  # 35590/35591, HIGH), via next@16.2.11's own EXACT `^0.34.5` optionalDependency
  # pin, which excludes the fix (Next.js's built-in image-optimization engine —
  # a real runtime path, not build tooling). 0.35.3 clears the age gate
  # (published 2026-07-01) and ships prebuilt binaries for every platform this
  # repo targets. Remove when next's own sharp pin reaches >=0.35.0.
  sharp: 0.35.3
  # ——— Advisory batch #5 (2026-08-04, closed issue #41): nine advisories landed
  # 08-03/04 across five packages — all transitive, every path build/dev/test tooling.
  # brace-expansion 5.0.9 (above) was taken separately on 08-03 (PR #38); postcss and
  # fast-uri are covered by the existing entries above, retargeted/annotated in this
  # batch because BOTH previously-pinned remediation values had themselves gone
  # vulnerable. The two entries below are new. Caught by CI's pnpm-audit lane;
  # Dependabot alerted on only the undici five.
  #
  # undici >=7.0.0 <7.29.0 — FIVE advisories at once (GHSA-4cwx-7wf7-3272, HIGH —
  # cross-user info disclosure + parse-time crash via degenerate private cache
  # directives — plus moderates GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5,
  # GHSA-jr45-8vmc-qm54, GHSA-v3r7-h72x-cjcm), all fixed in 7.29.0 (published
  # 2026-07-24, cleared the 7-day gate 07-31). Reached only via vitest→jsdom@29.1.1
  # (19 paths — test tooling; nothing here ships it). 7.29.0 is in-range for jsdom's
  # own `^7.25.0` — a fix-forward, not a pin-bypass. RANGED key, deliberately: a bare
  # key would pin every future resolution (so its own removal condition could never
  # trigger), and undici's `latest` is now the 8.x line (8.x fix floor 8.9.0), so a
  # bare key would silently force a future undici@8 copy cross-major DOWN to 7.29.0.
  # The ranged key rewrites only vulnerable copies, goes inert once the tree resolves
  # >=7.29.0 naturally, and leaves any future 8.x copy for `pnpm audit` to judge
  # loudly. Remove when the lockfile's undici entry moves past 7.29.0 (key inert then).
  "undici@<7.29.0": 7.29.0
  # socket.io-parser >=4.0.0 <4.2.7 (GHSA-2m8v-j782-fhvr, HIGH — zero-attachment
  # memory exhaustion), via react-email→socket.io@4.8.3 (the email dev preview
  # server — dev tooling only). 4.2.7 (published 2026-07-15, aged in 07-22) is
  # in-range for socket.io's own `~4.2.4` — the lockfile's 4.2.6 simply predates it.
  # Same ranged-key reasoning as undici above. Remove when the react-email chain
  # re-resolves >=4.2.7 (key inert then).
  "socket.io-parser@<4.2.7": 4.2.7
# Supply-chain release-age gate (Step 26 · A11). Every Phase-1/2 dep note describes this
# discipline ("let a release age before taking it; hours-old/days-old releases were
# rejected, pins were chosen to clear the gate"). It is ENFORCED at two layers:
#   - update layer  — Renovate (.github/renovate.json → minimumReleaseAge: "7 days")
#     gates what gets PROPOSED (a bump PR never lands a <7-day release).
#   - install layer — the pnpm setting below gates the EXISTING lockfile: pnpm
#     validates every entry against the gate on install (including `--frozen-lockfile`),
#     so a too-fresh transitive can never enter the tree through a lockfile edit either.
#
# Enabled 2026-07-08 (A11). It was left off while the repo was days old — pnpm checks
# the WHOLE lockfile, and the early deliberate pins (stripe, @sentry/nextjs, posthog-*,
# lucide-react, lint-staged) + their fresh transitives would have failed a frozen
# install. The tree has since aged past the window: a frozen install verified all 1021
# entries clear the gate. `minimumReleaseAge` reads each version's PUBLISH time (not its
# lockfile-add date), so packages added recently but published long ago (e.g. sonner,
# @manypkg/cli) pass. Value is in MINUTES.
#
# ——— Security fixes are NOT exempted here, and this is the one place the rule is stated.
# When an advisory's fix is younger than the gate, there are exactly three moves. Default
# to (1); (2) is a bounded exception, not a shortcut.
#   1. PARK IT — add the GHSA to `auditConfig.ignoreGhsas` with its reason, wait for the
#      fix to age in, then promote it to a real `overrides:` entry and delete the ignore.
#      This is the steady state; every deferral before 2026-08-03 took it.
#   2. DATED EXCLUDE — `minimumReleaseAgeExclude`, scoped to `name@exact-version`, only
#      when ALL hold: a published fix exists; the vulnerable path is build-tooling-only
#      (or the advisory is reachable in a runtime path, which makes waiting worse); the
#      expiry is no later than the date the fix ages in unaided; and it is recorded in
#      MAINTENANCE Watch + CHANGELOG. Parking would otherwise mean knowingly carrying an
#      unfixed HIGH. Used once — brace-expansion@5.0.9 (2026-08-03; deleted on schedule
#      2026-08-06 once it aged in).
#      ⚠️ Never scope by bare package NAME: that exempts every future release of it.
#   3. NEITHER FITS — no fix exists anywhere: `auditConfig.ignoreGhsas` with the path and
#      why it is low-risk here, and no expiry to promise.
# (`docs/MAINTENANCE.md` → Dependency policy carries the same three; keep them in step.)
minimumReleaseAge: 10080 # 7 days
# The 2026-08-03 `minimumReleaseAgeExclude` for brace-expansion@5.0.9 — route (2)'s one
# use, above — was REMOVED 2026-08-06 on schedule: 5.0.9 (published 2026-07-30T10:00:32Z)
# cleared the 7-day gate at 10:00:32Z that day, so the version-scoped entry had gone
# inert. The gate is unconditional again, with zero exclusions — verified by a frozen
# install against the existing lockfile.
# The 2026-07-23 `minimumReleaseAgeExclude` for next + @next/* was REMOVED 2026-07-28 on
# schedule: 16.2.11 (published 2026-07-21T16:00:01Z) cleared the 7-day gate that day, and
# every @next/* entry in the lockfile is either 16.2.11 (published ~2 minutes EARLIER) or
# @next/eslint-plugin-next@16.2.9 (2026-06-09), so nothing in the tree still needed the
# bypass. The gate is now unconditional again — which bites at the next RESOLUTION
# (Renovate, `pnpm add`), not at a lockfile-driven install.
# Audit allowlist (Step 26). `pnpm audit` (and the CI audit job) block on KNOWN
# advisories; a deep TRANSITIVE dep we can't bump directly gets acknowledged here with
# its path + why it's low-risk for this app, so the audit stays green on the accepted
# status quo and goes red the moment a NEW advisory appears. Prune an entry once the
# fix lands in the lockfile (an ignore for an absent advisory is a harmless no-op).
# Empty is the steady state. Deferrals here have been temporary by
# construction, with the same shape each time: a real fix exists but is younger than
# minimumReleaseAge, so the advisory is parked here and the entry is deleted the day the
# fix ages in and
# becomes a real override above. Re-emptied 2026-07-15 (effect · esbuild · postcss),
# 2026-07-27 (the two fast-uri GHSAs), 2026-07-30 (GHSA-mh99-v99m-4gvg, once
# brace-expansion 5.0.8 cleared the gate), and 2026-08-07 (GHSA-7p8r-x3mc-p8w7 —
# batch #5's fast-uri park, promoted to the 3.1.5 override above the day 3.1.5 aged
# in). `pnpm audit` therefore guards every
# override above live, and goes red the moment one regresses or a new advisory lands.
# ⚠️ For the one case that took route (2) instead — GHSA-rgw5-rvv9-x895, 2026-08-03, its
# dated exclude deleted on schedule 2026-08-06 — see the three-route rule stated once at
# `minimumReleaseAge` above. This note is a pointer; the rule and its criteria live there.
auditConfig:
  ignoreGhsas: []
